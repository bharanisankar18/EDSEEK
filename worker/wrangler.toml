name = "scholarship-hunter"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Set to your Pages URL after deploying, e.g. "https://scholarship-hunter.pages.dev"
ALLOWED_ORIGIN = "*"
GROQ_MODEL = "llama-3.3-70b-versatile"
GEMINI_MODEL = "gemini-2.5-flash"

[dev]
ip = "127.0.0.1"
port = 8787

[observability]
enabled = true

# Secrets — never put them here:
#   local:      copy .dev.vars.example to .dev.vars and fill it in
#   production: npx wrangler secret put GROQ_API_KEY
#               npx wrangler secret put GEMINI_API_KEY
